<div class="about-page">

  <div class="about-hero">
    <img src="logo/labu-icon.svg" alt="Lavapp" class="about-logo" aria-hidden="true" />
    <h1 class="about-title">{{ 'about.title' | translate }}</h1>
    <p class="about-intro">{{ 'about.intro' | translate }}</p>
  </div>

  <div class="about-body">
    <p>{{ 'about.p1' | translate }}</p>
    <p>{{ 'about.p2' | translate }}</p>
  </div>

  <div class="about-ctas">
    <div class="cta-block">
      <p class="cta-question">{{ 'about.cta_map_q' | translate }}</p>
      <a routerLink="/explore" class="btn btn-primary">{{ 'about.cta_map_a' | translate }}</a>
    </div>
    <div class="cta-block">
      <p class="cta-question">{{ 'about.cta_coffee_q' | translate }}</p>
      <a href="https://ko-fi.com/lavapp" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">{{ 'about.cta_coffee_a' | translate }}</a>
    </div>
  </div>

</div>
